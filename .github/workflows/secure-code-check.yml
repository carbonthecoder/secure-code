name: secure-code CI & Production Gatekeeper

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: 🛡️ secure-code Test Suite & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite (16 Unit Tests)
        run: npm test

      - name: Verify CLI Inject & Audit Execution
        run: |
          node bin/cli.js audit
          bash bin/secure-code.sh audit

      - name: Scan Code Recipes & Templates for Real Secrets
        run: |
          echo "Scanning recipes and templates for unmocked secrets..."
          if grep -rnEI '("|'\'')(AKIA[0-9A-Z]{16}|ghp_[0-9a-zA-Z]{36}|sk_live_[0-9a-zA-Z]{24})' recipes/ templates/; then
            echo "❌ CRITICAL: Hardcoded API secret detected in recipes or templates!"
            exit 1
          fi
          echo "✅ All recipes and templates are clean of secrets."

      - name: Audit Status
        run: echo "🎉 secure-code CI verification completed successfully."

