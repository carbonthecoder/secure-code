name: secure-code Production Gatekeeper

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  audit:
    name: 🛡️ secure-code Audit & Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan for Hardcoded Secrets
        run: |
          echo "Scanning for hardcoded API keys, private tokens, and secret strings..."
          if grep -rnEI '("|'\'')(AKIA[0-9A-Z]{16}|ghp_[0-9a-zA-Z]{36}|sk_live_[0-9a-zA-Z]{24})' --exclude-dir={.git,node_modules,target,vendor} .; then
            echo "❌ CRITICAL: Hardcoded API secret detected in codebase!"
            exit 1
          fi
          echo "✅ No hardcoded cloud secrets detected."

      - name: Scan for Raw SQL String Interpolation
        run: |
          echo "Scanning for dangerous SQL string interpolations..."
          if grep -rnEI '(SELECT|INSERT|UPDATE|DELETE).*\$\{.*\}' --include=*.ts --include=*.js --exclude-dir={node_modules,.next,dist} .; then
            echo "⚠️ WARNING: Possible raw SQL string interpolation detected. Parameterized queries required!"
          fi

      - name: Scan for Floating Point Currency Math
        run: |
          echo "Scanning for floating point money variables..."
          if grep -rnEI '(price|amount|balance|total|fee)\s*[:=]\s*(number|float|double)' --include=*.ts --include=*.py --include=*.go .; then
            echo "ℹ️ NOTE: Verify financial variables use integer minor units or Decimal types."
          fi

      - name: Audit Status
        run: echo "🎉 secure-code verification completed successfully."
