name: 🐛 Bug Report
description: Report an issue with the CLI engine, a false positive in the audit scanner, or an error in a rule file.
title: "[Bug]: <Summary of Bug>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with `secure-code`!
  - type: input
    id: environment
    attributes:
      label: Operating System & Shell
      placeholder: "e.g. Windows 11 (PowerShell 7) / macOS (Zsh) / Ubuntu 22.04 (Bash)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `.\bin\secure-code.ps1 inject <path>`
        2. See error...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
