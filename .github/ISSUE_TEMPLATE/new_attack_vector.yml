name: 🎯 Submit a New Attack Vector or AI Trap
description: Propose an elusive or emerging security vulnerability that AI coding assistants overlook.
title: "[Attack Vector]: <Short Description of Exploit / Failure Mode>"
labels: ["security", "new-vector"]
body:
  - type: markdown
    attributes:
      value: |
        Help make `secure-code` impenetrable by reporting a subtle vulnerability or AI blindspot!
  - type: input
    id: vector_name
    attributes:
      label: Attack Vector / Failure Name
      placeholder: "e.g. Server-Sent Events (SSE) Unbuffered Memory Leak on Disconnect"
    validations:
      required: true
  - type: textarea
    id: vulnerable_snippet
    attributes:
      label: Vulnerable AI Code Example (❌)
      description: Provide a minimal code snippet showing the typical vulnerable code generated by AI assistants.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: hardened_snippet
    attributes:
      label: Hardened Invariant Example (🛡️)
      description: Provide the hardened code snippet that eliminates this vulnerability.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: impact_explanation
    attributes:
      label: Security & Real-World Impact
      description: How could an attacker exploit this, or what outage does it cause in production?
    validations:
      required: true
